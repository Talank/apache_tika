name: main jdk21 build

on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      matrix:
        java: ['21']
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        include:
          - os: macos-latest
            extra_maven_args: "-Dtest=!SharedServerChaosMonkeyTest"
          - os: windows-latest
            extra_maven_args: "-Dtest=!SharedServerChaosMonkeyTest"
      fail-fast: false

    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'
      - name: Build with Maven
        run: mvn clean test install javadoc:aggregate -Pci -B
          "-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"
          ${{ matrix.extra_maven_args }}
